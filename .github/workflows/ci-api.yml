name: CI — API

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci-api.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sher
          POSTGRES_PASSWORD: sher
          POSTGRES_DB: sher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter api lint

      - name: Typecheck
        run: pnpm --filter api typecheck

      - name: Run Prisma migrations
        run: pnpm --filter api migrate:deploy
        env:
          DATABASE_URL: postgresql://sher:sher@localhost:5432/sher_test

      - name: Test
        run: pnpm --filter api test --coverage
        env:
          DATABASE_URL: postgresql://sher:sher@localhost:5432/sher_test
